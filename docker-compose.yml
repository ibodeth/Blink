services:
  blink:
    build:
      context: .
      dockerfile: Dockerfile
    image: blink-assistant:4.2.0
    container_name: blink
    restart: unless-stopped
    environment:
      # Provide your key here or via an .env file in this directory.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      BLINK_HEADLESS: "1"
      BLINK_HOST: "0.0.0.0"
      BLINK_PORT: "8000"
      # Strongly recommended when exposing the container: pin an auth token so
      # privileged WebSocket actions require it.
      BLINK_WS_TOKEN: ${BLINK_WS_TOKEN:-}
      BLINK_ALLOWED_ORIGINS: ${BLINK_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      BLINK_LOG_JSON: "1"
    ports:
      - "8000:8000"
    volumes:
      # Persist conversational memory + downloaded models across restarts.
      - blink-data:/app/data
      - blink-models:/app/models
      - blink-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  blink-data:
  blink-models:
  blink-logs:
